<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayPal</title>
  <style>
    /* Fuentes y colores inspirados en RAWG */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: #1e1e1e;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      font-weight: bold;
      color: #ff9800;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1em;
      color: #d4d4d4;
    }

    button {
      padding: 12px 25px;
      background: linear-gradient(90deg, #ff9800, #ff5722);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.5);
    }

    .results {
      margin-top: 20px;
      padding: 20px;
      background-color: #2a2a2a;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
    }

    .game-card {
      display: flex;
      align-items: center;
      margin: 15px 0;
      background: #333;
      color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .game-card img {
      width: 100px;
      height: auto;
      border-radius: 8px;
      margin-right: 15px;
    }

    .game-card .game-info {
      flex: 1;
    }

    select {
      padding: 10px;
      margin: 10px 0;
      background-color: #1e1e1e;
      color: #fff;
      border: 1px solid #555;
      border-radius: 5px;
      font-size: 1em;
    }

    select option {
      background: #1e1e1e;
      color: #fff;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      background: #1e1e1e;
      color: #fff;
      text-align: center;
    }

    footer a {
      color: #ff9800;
      text-decoration: none;
      margin: 0 10px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #2a2a2a;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      width: 90%;
      max-width: 400px;
    }

    .modal textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #1e1e1e;
      border: 1px solid #555;
      border-radius: 5px;
      color: #fff;
      font-size: 1em;
    }

    .modal button {
      padding: 10px 20px;
      background: linear-gradient(90deg, #ff9800, #ff5722);
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    .modal button:hover {
      opacity: 0.9;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
    }

    .thank-you {
      display: none;
      color: #ff9800;
      font-size: 1.2em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PlayPal</h1>
    <p>Selecciona tu estado de ánimo y preferencias para recibir recomendaciones de juegos.</p>

    <label for="mood">¿Cómo te sientes hoy?</label><br>
    <select id="mood">
      <option value="relaxing,family-friendly,casual">Relajado 🕊️</option>
      <option value="hard,fast-paced,competitive">Intenso ⚡</option>
      <option value="story-rich,atmospheric,emotional">Inmersivo 🌌</option>
      <option value="sandbox,open-world,simulation">Creativo 🎨</option>
    </select><br><br>

    <label for="genre">¿Cómo quieres jugar?</label><br>
    <select id="genre">
      <option value="story-rich,emotional">Narrativo 📖</option>
      <option value="open-world,adventure,fantasy">Exploración 🧭</option>
      <option value="hard,strategy,survival">Desafiante 💪</option>
      <option value="co-op,multiplayer">Colaborativo 🤝</option>
      <option value="singleplayer">Individual 🎮</option>
    </select><br><br>

    <button id="recommendButton">Obtener Recomendación</button>

    <div class="results" id="results"></div>
  </div>

  <footer>
    <p>© 2025 PlayPal. Todos los derechos reservados.</p>
    <p>Datos proporcionados por <a href="https://rawg.io/" target="_blank">RAWG.io</a></p>
    <button id="feedbackButton">Contanos cómo mejorar</button>
  </footer>

  <div class="modal-overlay" id="modalOverlay"></div>

  <div class="modal" id="feedbackModal">
    <h3>Deja tus sugerencias</h3>
    <textarea id="feedbackInput" placeholder="Escribe aquí tus sugerencias..." rows="4"></textarea>
    <button id="sendFeedbackButton">Enviar</button>
    <button id="closeModalButton">Cerrar</button>
  </div>

  <div class="thank-you" id="thankYouMessage">
    ¡Gracias por tu recomendación! Intentaremos mejorar para la próxima.
  </div>

  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>
    // Inicializa EmailJS
    emailjs.init("wS-6dQkyfuF1njWvO");

    document.getElementById('sendFeedbackButton').addEventListener('click', function () {
      const feedback = document.getElementById('feedbackInput').value;

      if (feedback.trim()) {
        const templateParams = {
          message: feedback, // Variable para la plantilla
        };

        emailjs.send('service_jiwor6a', 'template_54yl3u7', templateParams)
          .then(() => {
            document.getElementById('feedbackInput').value = '';
            document.getElementById('thankYouMessage').style.display = 'block';
            setTimeout(() => {
              document.getElementById('thankYouMessage').style.display = 'none';
            }, 5000);
          })
          .catch((error) => {
            alert('Error al enviar la sugerencia. Intenta nuevamente.');
            console.error('EmailJS error:', error);
          });
      } else {
        alert('Por favor, escribe una sugerencia antes de enviar.');
      }
    });

    document.getElementById('feedbackButton').addEventListener('click', function () {
      document.getElementById('feedbackModal').style.display = 'block';
      document.getElementById('modalOverlay').style.display = 'block';
    });

    document.getElementById('closeModalButton').addEventListener('click', function () {
      document.getElementById('feedbackModal').style.display = 'none';
      document.getElementById('modalOverlay').style.display = 'none';
    });

    document.getElementById('modalOverlay').addEventListener('click', function () {
      document.getElementById('feedbackModal').style.display = 'none';
      document.getElementById('modalOverlay').style.display = 'none';
    });
  </script>
</body>
</html>
